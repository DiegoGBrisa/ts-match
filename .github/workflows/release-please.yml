name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_tag:
        description: Optional existing release tag to validate and publish to npm. Leave blank for normal release-please automation.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 10.0.0
  YARN_VERSION: 4.5.3
  BUN_VERSION: 1.3.13

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release PR
        id: release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_tag == ''
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Skip release-please for manual publish recovery
        if: github.event_name == 'workflow_dispatch' && inputs.publish_tag != ''
        run: echo "Manual publish recovery requested for ${{ inputs.publish_tag }}."

  resolve-release:
    name: Resolve release to publish
    runs-on: ubuntu-latest
    needs: release-please
    if: always()
    outputs:
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - name: Resolve release tag
        id: resolve
        env:
          MANUAL_PUBLISH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_tag || '' }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ -n "${MANUAL_PUBLISH_TAG}" ]]; then
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
            echo "tag_name=${MANUAL_PUBLISH_TAG}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${RELEASE_CREATED}" == "true" ]]; then
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
            echo "tag_name=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "should_publish=false" >> "${GITHUB_OUTPUT}"
          echo "tag_name=" >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate release / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: resolve-release
    if: needs.resolve-release.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        run: pnpm release:verify-tag -- "${{ needs.resolve-release.outputs.tag_name }}"

      - name: Check package has zero runtime dependencies
        run: pnpm check:zero-runtime-deps

      - name: Audit production dependency tree
        run: pnpm audit --prod

      - name: Run release checks
        run: |
          pnpm lint
          pnpm build
          pnpm typecheck:only
          pnpm test:type
          pnpm test:diagnostics
          pnpm test:coverage
          pnpm smoke:exports
          pnpm test:docs
          pnpm test:examples:validate
          pnpm test:examples:run

      - name: Run TypeScript performance benchmark
        run: pnpm bench:types

      - name: Run runtime benchmark budgets
        run: pnpm bench:native:check:only

      - name: Check package contents and tarball smoke
        run: pnpm pack:check:only

  package-manager-smoke:
    name: Package smoke / Node ${{ matrix.node-version }} / ${{ matrix.package-manager }}
    runs-on: ubuntu-latest
    needs: resolve-release
    if: needs.resolve-release.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        package-manager: [npm, pnpm, yarn, bun]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Yarn
        if: matrix.package-manager == 'yarn'
        run: corepack prepare yarn@${YARN_VERSION} --activate

      - name: Setup Bun
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack package
        run: |
          rm -rf .pack
          mkdir -p .pack
          pnpm build
          pnpm pack --pack-destination .pack --json

      - name: Smoke test packed tarball
        run: pnpm smoke:package-manager -- "${{ matrix.package-manager }}"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - resolve-release
      - validate
      - package-manager-smoke
    if: needs.resolve-release.outputs.should_publish == 'true'
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-release.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        run: pnpm release:verify-tag -- "${{ needs.resolve-release.outputs.tag_name }}"

      - name: Verify npm version is unpublished
        run: pnpm release:verify-unpublished

      - name: Build and validate publish tarball
        run: pnpm pack:check

      - name: Publish tarball with provenance
        run: |
          tarball_count=$(find .pack -maxdepth 1 -type f -name "*.tgz" | wc -l | tr -d ' ')
          if [ "${tarball_count}" -ne 1 ]; then
            printf 'Expected exactly one packed tarball, found %s.\n' "${tarball_count}" >&2
            exit 1
          fi
          tarball=$(find .pack -maxdepth 1 -type f -name "*.tgz" | sort | sed -n '1p')
          npm publish "${tarball}" --ignore-scripts --provenance --access public
