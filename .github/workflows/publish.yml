name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

env:
  PNPM_VERSION: 10.0.0
  YARN_VERSION: 4.5.3
  BUN_VERSION: 1.3.13

jobs:
  validate:
    name: Validate release / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false && github.event.release.draft == false
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        run: pnpm release:verify-tag -- "${{ github.event.release.tag_name }}"

      - name: Check package has zero runtime dependencies
        run: pnpm check:zero-runtime-deps

      - name: Audit production dependency tree
        run: pnpm audit --prod

      - name: Run project checks
        run: pnpm check

      - name: Run TypeScript performance benchmark
        run: pnpm bench:types

      - name: Run runtime benchmark budgets
        run: pnpm bench:native:check:only

      - name: Check package contents and tarball smoke
        run: pnpm pack:check:only

  package-manager-smoke:
    name: Package smoke / Node ${{ matrix.node-version }} / ${{ matrix.package-manager }}
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false && github.event.release.draft == false
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        package-manager: [npm, pnpm, yarn, bun]
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Yarn
        if: matrix.package-manager == 'yarn'
        run: corepack prepare yarn@${YARN_VERSION} --activate

      - name: Setup Bun
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack package
        run: |
          rm -rf .pack
          mkdir -p .pack
          pnpm build
          pnpm pack --pack-destination .pack --json

      - name: Smoke test packed tarball
        run: pnpm smoke:package-manager -- "${{ matrix.package-manager }}"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs:
      - validate
      - package-manager-smoke
    if: github.event.release.prerelease == false && github.event.release.draft == false
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        run: pnpm release:verify-tag -- "${{ github.event.release.tag_name }}"

      - name: Verify npm version is unpublished
        run: pnpm release:verify-unpublished

      - name: Publish with provenance
        run: npm publish --provenance --access public
